# TérangaTable — nginx vhost for the host system
#
# ⚠️  THIS IS THE CONFIGURATION ACTUALLY USED IN PRODUCTION.
#     nginx runs on the HOST (not in Docker — docker-compose.prod.yml has no nginx
#     service). It reverse-proxies to the containers published on loopback:
#       web → 127.0.0.1:3020    api → 127.0.0.1:3021    minio → 127.0.0.1:9002
#     The files nginx.conf / nginx.init.conf / nginx.https.conf in this directory
#     are UNUSED legacy (see the banner at the top of each).
#
# Deployed at: /etc/nginx/sites-available/terangatable.cloud
#   sudo cp infrastructure/nginx/terangatable.cloud /etc/nginx/sites-available/terangatable.cloud
#   sudo ln -s /etc/nginx/sites-available/terangatable.cloud /etc/nginx/sites-enabled/
#   sudo cp infrastructure/nginx/ssl-params.conf /etc/nginx/ssl-params.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── DNS + TLS setup (Cloudflare) ─────────────────────────────────────────────
# 1. terangatable.cloud's nameservers point to Cloudflare (domain stays registered
#    at Hostinger). Currently: hasslo.ns.cloudflare.com / robin.ns.cloudflare.com
# 2. Cloudflare dashboard, DNS tab: A records for terangatable.cloud, www, api, and
#    a wildcard "*", all pointing to this server's IP, all "Proxied" (orange cloud).
# 3. SSL/TLS tab → encryption mode "Full (strict)".
# 4. SSL/TLS → Origin Server → Create Certificate. Hostnames: terangatable.cloud and
#    *.terangatable.cloud (the wildcard SAN covers www, api, and every tenant
#    subdomain — one level deep). 15-year validity, NO RENEWAL NEEDED.
# 5. Save the generated cert + key on this server (do NOT paste them into a chat/ticket):
#      sudo mkdir -p /etc/ssl/cloudflare
#      sudo nano /etc/ssl/cloudflare/terangatable.cloud.pem   # paste the certificate
#      sudo nano /etc/ssl/cloudflare/terangatable.cloud.key   # paste the private key
#      sudo chmod 600 /etc/ssl/cloudflare/terangatable.cloud.key
#    Current cert: issued 2026-08-15, expires 2041-08-11.
#
# ── History: the 2026-09-04 outage (Cloudflare error 526) ────────────────────
# Before 2026-09-05 these vhosts pointed at Let's Encrypt certs
# (/etc/letsencrypt/live/terangatable.cloud{,-0001}/) even though the Cloudflare
# Origin cert above had already been installed on 2026-08-15. The Let's Encrypt
# cert expired on 2026-09-04 15:49 UTC with no renewal automation, Cloudflare
# rejected the expired origin cert under Full (strict), and the whole site went
# down with error 526. The fix was to point every block at the Origin cert below.
# Do NOT reintroduce Let's Encrypt here: the Origin cert needs no renewal, whereas
# a wildcard from Let's Encrypt requires a DNS-01 challenge that nothing automates
# on this box. The old /etc/letsencrypt/live/terangatable.cloud* lineages are dead
# and can be removed with `sudo certbot delete --cert-name terangatable.cloud`
# (and `--cert-name terangatable.cloud-0001`). Leave the innosft.com certs alone.

# Restore the real visitor IP (Cloudflare's proxy IP would otherwise show up as
# $remote_addr in logs and in X-Real-IP/X-Forwarded-For).
# Ranges from https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name terangatable.cloud www.terangatable.cloud *.terangatable.cloud
                api.terangatable.cloud;
    return 301 https://$host$request_uri;
}

# ── Frontend — terangatable.cloud + www ──────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name terangatable.cloud www.terangatable.cloud;

    ssl_certificate     /etc/ssl/cloudflare/terangatable.cloud.pem;
    ssl_certificate_key /etc/ssl/cloudflare/terangatable.cloud.key;
    include /etc/nginx/ssl-params.conf;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Tenant subdomains — *.terangatable.cloud ─────────────────────────────────
# Each restaurant gets <slug>.terangatable.cloud; the Next.js app resolves the
# tenant from the Host header, so this proxies to the same upstream as the apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.terangatable.cloud;

    ssl_certificate     /etc/ssl/cloudflare/terangatable.cloud.pem;
    ssl_certificate_key /etc/ssl/cloudflare/terangatable.cloud.key;
    include /etc/nginx/ssl-params.conf;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── API — api.terangatable.cloud ─────────────────────────────────────────────
# Listed after the wildcard block for readability only: nginx matches exact
# server_names before wildcards, so this always wins over *.terangatable.cloud.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.terangatable.cloud;

    ssl_certificate     /etc/ssl/cloudflare/terangatable.cloud.pem;
    ssl_certificate_key /etc/ssl/cloudflare/terangatable.cloud.key;
    include /etc/nginx/ssl-params.conf;

    client_max_body_size 20M;

    # MinIO public asset proxy (read-only, bucket must have public policy)
    location /minio/ {
        proxy_pass http://127.0.0.1:9002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

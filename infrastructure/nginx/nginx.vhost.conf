# TérangaTable — nginx vhost for host system
# Copy to /etc/nginx/sites-available/terangatable.cloud
# then: sudo ln -s /etc/nginx/sites-available/terangatable.cloud /etc/nginx/sites-enabled/
#
# ── DNS + TLS setup (Cloudflare) ─────────────────────────────────────────────
# 1. terangatable.cloud's nameservers point to Cloudflare (domain stays registered at Hostinger).
# 2. In the Cloudflare dashboard, DNS tab: A records for terangatable.cloud, www, api, and
#    a wildcard "*" record, all pointing to this server's IP, all set to "Proxied" (orange cloud).
# 3. SSL/TLS tab → set encryption mode to "Full (strict)".
# 4. SSL/TLS → Origin Server → Create Certificate. Hostnames: terangatable.cloud and
#    *.terangatable.cloud (the wildcard SAN covers www, api, and every tenant subdomain —
#    one level deep). 15-year validity, no renewal needed.
# 5. Save the generated cert + key on this server (do NOT paste them into a chat/ticket):
#      sudo mkdir -p /etc/ssl/cloudflare
#      sudo nano /etc/ssl/cloudflare/terangatable.cloud.pem   # paste the certificate
#      sudo nano /etc/ssl/cloudflare/terangatable.cloud.key   # paste the private key
#      sudo chmod 600 /etc/ssl/cloudflare/terangatable.cloud.key
# then: sudo nginx -t && sudo nginx -s reload

# Restore the real visitor IP (Cloudflare's proxy IP would otherwise show up as $remote_addr
# in logs and in X-Real-IP/X-Forwarded-For). Ranges from https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Frontend — terangatable.cloud (+ www + tenant subdomains)
server {
    listen 80;
    listen [::]:80;
    server_name terangatable.cloud www.terangatable.cloud *.terangatable.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name terangatable.cloud www.terangatable.cloud *.terangatable.cloud;

    ssl_certificate     /etc/ssl/cloudflare/terangatable.cloud.pem;
    ssl_certificate_key /etc/ssl/cloudflare/terangatable.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# API — api.terangatable.cloud
server {
    listen 80;
    listen [::]:80;
    server_name api.terangatable.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.terangatable.cloud;

    ssl_certificate     /etc/ssl/cloudflare/terangatable.cloud.pem;
    ssl_certificate_key /etc/ssl/cloudflare/terangatable.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # MinIO public asset proxy (read-only, bucket must have public policy)
    location /minio/ {
        proxy_pass http://127.0.0.1:9002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

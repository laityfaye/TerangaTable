# TérangaTable — nginx vhost for host system
# Copy to /etc/nginx/sites-available/terangatable.cloud
# then: sudo ln -s /etc/nginx/sites-available/terangatable.cloud /etc/nginx/sites-enabled/
# then: sudo mkdir -p /var/www/letsencrypt
#
# Wildcard subdomains (tenant sites, e.g. les-delices-thies.terangatable.cloud) require:
#   1. A DNS wildcard record: *.terangatable.cloud → this server's IP (A/AAAA), at your DNS provider.
#   2. A wildcard cert. *.terangatable.cloud CANNOT be validated via --webroot (HTTP-01) —
#      it needs DNS-01, using your DNS provider's certbot plugin, e.g.:
#      sudo certbot certonly --dns-<provider> \
#         -d terangatable.cloud -d www.terangatable.cloud -d api.terangatable.cloud -d '*.terangatable.cloud' \
#         --email innosoftcreation@gmail.com --agree-tos --non-interactive
#      (replace --dns-<provider> with your registrar's certbot DNS plugin, e.g. --dns-cloudflare, --dns-ovh)
# then: sudo nginx -s reload

# Frontend — terangatable.cloud (+ www + tenant subdomains)
server {
    listen 80;
    listen [::]:80;
    server_name terangatable.cloud www.terangatable.cloud *.terangatable.cloud;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name terangatable.cloud www.terangatable.cloud *.terangatable.cloud;

    ssl_certificate     /etc/letsencrypt/live/terangatable.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terangatable.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# API — api.terangatable.cloud
server {
    listen 80;
    listen [::]:80;
    server_name api.terangatable.cloud;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.terangatable.cloud;

    ssl_certificate     /etc/letsencrypt/live/terangatable.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terangatable.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # MinIO public asset proxy (read-only, bucket must have public policy)
    location /minio/ {
        proxy_pass http://127.0.0.1:9002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

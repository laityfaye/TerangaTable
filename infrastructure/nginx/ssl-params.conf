# Shared TLS + security-header settings, included by every HTTPS block in
# nginx.vhost.conf. Deploy to /etc/nginx/ssl-params.conf on the host.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;

# NOTE: no ssl_stapling here. The origin now serves a Cloudflare Origin CA
# certificate, which is not publicly trusted and carries no OCSP responder URL,
# so stapling would only log "ssl_stapling ignored, no OCSP responder URL" on
# every reload. Visitors get a real, publicly-trusted cert from Cloudflare's
# edge anyway — this leg is Cloudflare ↔ origin only.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
